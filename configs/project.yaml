project:
  name: spare-parts-demand-scheduling
  data_kind: synthetic
  random_seed: 42
  claim_scope: method validated on simulated data

specification:
  version: "4.2"
  document: docs/SPEC.md
  document_status: final_supersedes_earlier_versions
  supersedes: v4.1 and the MVP alignment amendment
  change_control: v4.2 consolidation logged in STATE.md; later changes need a logged reason

classification:
  target_column: part_category
  material_group_target_status: not_available_in_catalogue
  confidence_threshold: 0.60
  confidence_threshold_status: provisional_editable
  cv_folds: 5
  group_holdout_test_fraction: 0.25
  seed: 42

paths:
  demand_csv: data/01_demand_forecasting.csv
  scheduling_csv: data/02_scheduling_inputs.csv
  catalogue_csv: data/03_spare_parts_catalogue.csv
  artifacts_dir: artifacts
  results_dir: results
  reports_dir: reports

application:
  frontend: react_typescript
  backend: django_drf
  database: sqlite_development
  backend_count: 1
  ml_execution: imported_python_packages_in_process
  ml_package_root: src
  separate_ml_http_service: false
  background_jobs: django_management_commands
  task_queue: false
  api_authentication: jwt
  authorization: django_groups_and_drf_permissions

forecast:
  horizon_weeks: 14
  training_target_column: demand_qty
  training_target_decision_phase: 1
  scoring_target_column: demand_qty
  exclude_missing_week_from_fit_and_score: true
  genuine_zero_demand_is_observed: true
  future_rows_are_prediction_only: true
  series_keys:
    - part_id
    - region
  analog_group_keys:
    - part_category
    - vehicle_type
  split_dates:
    warmup_end: "2024-01-01"
    train_validation_end: "2026-03-23"
    final_test_start: "2026-03-30"
    final_test_end: "2026-09-21"
    future_start: "2026-09-28"
    future_end: "2026-12-28"
  final_test_open_phase: 7
  forbidden_feature_columns:
    - out_consumption_qty
    - out_backorder_qty
    - out_lost_sales_qty
    - out_stockout_flag
    - out_spike_flag
    - out_unusual_demand_flag
    - intended_sbc_class
    - demand_driver_tags
  leakage_sensitive_feature_columns:
    - lifecycle_pattern
    - demand_class_trainval
    - adi_trainval
    - cv2_trainval
    - abc_class
    - part_type
    - demand_lag52
  segmentation:
    minimum_observed_weeks: 26
    minimum_positive_weeks_for_cv2: 3
    adi_threshold: 1.32
    cv2_threshold: 0.49
    sparse_series_cv2_convention: 1.0
    sparse_series_classification: generator_compatible_smooth_or_lumpy
    abc_method: cumulative_annualized_usage_value
    abc_thresholds:
      A_cumulative_value_share: 0.80
      B_cumulative_value_share: 0.95
    xyz_method: coefficient_of_variation_on_part_weekly_demand_aggregated_across_regions
    xyz_thresholds:
      X_max_cv: 0.50
      Y_max_cv: 1.00
  feature_engineering:
    target_lags_weeks: [1, 4, 13, 52]
    rolling_windows_weeks: [4, 13, 52]
    rolling_statistics: [mean, median, std]
    rolling_uses_prior_only: true
    multi_step_strategy: recursive_one_step
    optional_covariates_require_origin_confirmation: true
    known_in_advance:
      - festival_calendar
      - plant_calendar
      - plant_shutdowns
      - published_promotions
      - published_campaigns
    unavailable_without_origin_evidence:
      - unplanned_market_events
      - realized_future_market_index
      - vehicle_parc
      - average_vehicle_age
      - substitution_groups
  backtest:
    horizon_weeks: 14
    seed: 42
    origins:
      - "2024-07-01"
      - "2024-10-07"
      - "2025-01-13"
      - "2025-04-21"
      - "2025-07-28"
      - "2025-11-03"
    tuning_origin_count: 2
    non_overlapping_horizons: true
    training_labels: train_val_only
    warmup_use: lag_and_history_initialization_only
    lead_time_mapping: sob_weighted_mean_supplier_lead_time_days
    lead_time_rounding: ceil_to_weeks_minimum_one
    over_horizon_lead_time_extension: last_period_average
    over_horizon_extension_label_required: true
    over_horizon_extension_period_weeks: 4
    unavailable_future_covariates:
      - unplanned_market_events
      - market_condition_index
      - vehicle_parc
      - average_vehicle_age
      - substitution_groups
    sbc_router:
      Smooth: lightgbm_tweedie
      Erratic: lightgbm_tweedie
      Intermittent: sba
      Lumpy: sba
      Unclassified: analogue_category_vehicle_fallback
    lightgbm_search:
      configurations_per_objective: 3
      num_leaves: [15, 31, 63]
      learning_rate: [0.03, 0.05, 0.1]
      n_estimators: [100, 200, 300]
      min_child_samples: [20, 50]
      feature_fraction: [0.8, 1.0]
    quantiles: [0.50, 0.90, 0.95, 0.99]

service_level_targets:
  High: 0.99
  Medium: 0.95
  Low: 0.90
  source: scheduling_snapshot
  validation_threshold_absolute_difference: 0

scoring:
  normalization: average_rank_within_eligible_candidates
  missing_metric_score: 0
  tie_break_order:
    - simplicity
    - explainability
    - runtime
  weight_sensitivity_points: 10
  tracks:
    forecasting:
      lead_time_wape_share: 0.70
      weekly_wape_share: 0.30
      lead_time_calibration_share: 0.70
      weekly_calibration_share: 0.30
      weight_total: 1.0
      weights:
        overall_error: 0.20
        critical_a_class_error: 0.20
        intermittent_lumpy: 0.15
        asymmetric_absolute_bias: 0.15
        calibration: 0.15
        stability_across_origins: 0.10
        runtime_and_explainability: 0.05
      component_scoring:
        critical_error: lead_time_wape_plus_asymmetric_bias
        intermittent_lumpy:
          lead_time_wape_share: 0.50
          mase_share: 0.50
        asymmetric_bias:
          overall_levels:
            lead_time_share: 0.70
            weekly_share: 0.30
          critical_underforecast_cutoff: -0.10
        runtime_and_explainability:
          runtime_share: 0.50
          explainability_share: 0.50
      gates:
        enforce:
          baseline_beating: true
          overall_bias: false
          critical_underforecast_bias: false
          critical_p95_coverage: false
        baseline_candidates:
          - seasonal_naive_52::baseline_default
          - historical_average::origin_mean
        overall_absolute_bias_max: 0.10
        critical_underforecast_bias_min: -0.10
        critical_p95_coverage_target: 0.95
        critical_p95_coverage_tolerance: 0.05
        bootstrap_replicates: 2000
        bootstrap_confidence_level: 0.95
        bootstrap_unit: part_region_and_origin
        random_seed: 42
      sensitivity:
        perturbation_points: 10
        champion_minimum_win_share: 0.75
        composite_minimum_origin_wins: 3
        report_bias_overlap_removed_scenario: true
    scheduling:
      weights:
        critical_part_availability: 0.25
        overall_fill_rate_and_stockout: 0.15
        emergency_procurement: 0.15
        excess_inventory_and_carrying_cost: 0.20
        schedule_adherence_and_stability: 0.15
        inventory_turnover: 0.10
      weight_total: 1.0
      hard_constraint_violations_allowed: 0
    assistant:
      weights:
        intent_accuracy: 0.25
        entity_accuracy: 0.25
        rule_validation_correctness: 0.20
        multilingual_consistency: 0.15
        audit_completeness: 0.10
        latency_cost: 0.05

phase4:
  finalist_count: 5
  calibration_quantiles: [0.90, 0.95, 0.99]
  statistical_comparisons:
    confidence_level: 0.95
    bootstrap_replicates: 2000
    bootstrap_unit: part_region
    dm_loss: weekly_wape_by_target_week
    dm_horizon_weeks: 14
    dm_hac_max_lag_weeks: 13
    random_seed: 42
  tier2_random_forest:
    trigger: phase3_intermittent_lumpy_gap
    tuning_origins:
    - "2024-07-01"
    - "2024-10-07"
    held_validation_origins:
    - "2025-01-13"
    - "2025-04-21"
    - "2025-07-28"
    - "2025-11-03"
    configurations:
    - {n_estimators: 60, max_depth: 12, min_samples_leaf: 5, max_features: 0.8}
    - {n_estimators: 80, max_depth: 16, min_samples_leaf: 5, max_features: 0.8}
    - {n_estimators: 100, max_depth: 20, min_samples_leaf: 10, max_features: 0.7}
  explainability_tier:
    formula_baseline: 3
    intermittent_baseline: 3
    global_tree_model: 2
    ensemble_or_router: 1

assistant:
  languages:
    - en
    - hi
    - hinglish
    - mr
  proposal_latency_budget_seconds: 5
  latency_budget_is_project_assumption: true
  explicit_confirmation_required: true
  llm_may_compute_schedule_quantities: false

scheduling:
  simulator_assumptions:
    status: phase5_frozen
    version: phase5-assumptions-v2
    seed: 42
    schedule_granularity:
      level: part
      region_plant_label: ALL
      regional_allocation_modelled: false
    initial_inventory:
      source: data/02_scheduling_inputs.csv
      rule: use_available_qty_after_exact_on_hand_reserved_blocked_reconciliation
      temporal_treatment: synthetic_initialization_rebased_to_each_validation_origin
      same_for_every_policy: true
      warmup: no_historical_roll_forward_from_snapshot
      initial_stock_multiplier: 1.0
    inbound_receipts:
      due_this_month: week_1
      due_later: week_4
      in_transit: week_1
      due_later_week: 4
      earliest_open_po_eta: not_rebased_because_snapshot_postdates_validation
      open_po_due_split_is_counted_once: true
      limitations: d2_has_no_order_ids_or_individual_receipt_dates
    pending_requirement:
      source_column: backorder_qty
      status: labelled_assumption
      apply_as_initial_backlog_only_for_high_criticality: true
    backlog_and_lost_sales:
      High: backorder
      Medium: lost_sales
      Low: lost_sales
    lead_time:
      arrival_week_rule: release_week_plus_max_one_ceil_days_div_7
      above_horizon: extend_planning_demand_by_mean_of_last_four_forecast_weeks
      beyond_horizon_orders: retain_and_flag_not_received_inside_horizon
    supplier_uncertainty:
      late_probability_source: supN_otd_pct
      late_delay_source: supN_avg_delay_days
      rejection_probability_source: supN_reject_pct
      rejection_semantics: whole_lot_probability_no_per_unit_evidence_in_generator
      default_rejection_variant: whole_lot
      alternative_rejection_variant: per_unit_binomial
      seed: 42
      reliability_pct: record_only_not_applied_because_it_overlaps_otd_and_rejection
    capacity:
      quantity_unit: same_unit_as_order_qty_per_calendar_month
      available_capacity_rule: monthly_capacity_times_one_minus_committed_percent
      capacity_overrun: partial_allocation_only_and_unresolved
      pull_ahead:
        enabled: true
        passes: 1
        use_earlier_calendar_month_capacity: true
        earliest_release_week: 1
        arrival_rule_unchanged: true
        unresolved_shortfall_remains_unresolved: true
    safety_stock:
      quantile_selection: smallest_available_quantile_at_or_above_service_target
      maximum_quantile: 0.99
      region_aggregation: sum_regional_point_and_quantile_forecasts_by_week
      time_aggregation: sum_weekly_values_over_lead_time_window
      aggregation_label: conservative_sum_of_marginal_quantiles
      calibration_multiplier:
        enabled: false
        fitting_data: tuning_origin_quantile_forecasts_only
    emergency_procurement:
      trigger: critical_backlog_remaining_at_week_close
      quantity: exact_remaining_critical_backlog
      arrival: start_of_next_week
      unit_cost_multiplier: 1.5
      sensitivity_range: [1.25, 2.0]
      status: provisional_proxy
      definition: emergency_order_unit_cost_times_multiplier
      proxy_only: true
    plant_calendar:
      demand_treatment: use_validation_weekly_demand_as_observed
      capacity_treatment: preserve_monthly_supplier_capacity_without_weekday_adjustment
      status: no_verified_plant_specific_capacity_calendar
    currency: INR
    currency_source: unit_cost_dataset
    carrying_cost:
      use_part_carrying_cost_rate_when_present: true
      fallback_annual_rate: 0.25
      fallback_is_proxy: true
    stockout_cost:
      basis: unit_cost_times_criticality_multiplier
      criticality_multiplier:
        High: 10.0
        Medium: 5.0
        Low: 2.0
      relative_sensitivity: 0.50
      proxy_only: true
    service_level_violation:
      threshold: per_part_service_level_target
      count_as_hard_constraint_violation: false
    stockout_measurement:
      timing: close_of_week_before_emergency_receipt
      critical_parts: remaining_backlog_at_week_close
      other_parts: lost_sales_at_week_close
      emergency_orders_excluded_from_schedule_checker: true
      emergency_orders_reported_separately: true
    sensitivity_scenarios:
      initial_stock_multiplier: 0.5
      due_later_weeks: [3, 6]
      rejection_variant: per_unit_binomial
  supplier_risk:
    risk_score_definition: one_minus_supN_reliability_pct_over_100
    risk_level_method: population_tertiles_of_part_sob_weighted_risk_score
    high_share_warning_pct: 50
    high_share_warning_status: provisional_editable
    planning_lead_time_adjustment: lead_time_days_plus_one_minus_otd_pct_times_avg_delay_days
    planning_rejection_gross_up: required_quantity_over_one_minus_reject_pct
    display_only: true
  reorder_point:
    definition: lead_time_point_demand_plus_safety_stock
    trigger_rule: first_week_projected_inventory_at_or_below_reorder_point
    comparison_source: data/02_scheduling_inputs.csv.current_reorder_point_qty
  feasibility_thresholds:
    hard_constraint_violations_allowed: 0
    quantity_tolerance: 0
    supplier_capacity_exceedance_allowed: 0
    sob_target_deviation:
      hard_constraint: false
      report_absolute_percentage_point_deviation: true
    sob_interpretation: target_allocation_not_binding_contract

phase_gates:
  run_pytest_at_each_gate: true
  tier_1_required: true
  tier_2_requires_measured_tier_1_gap: true
  tier_3_deferred_unless_requested: true
